<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>iframe 픽스처</title>
    <style>
      body { margin: 0; padding: 20px; font: 14px/1.6 "Malgun Gothic", system-ui, sans-serif; background: #f5f7fb; }
      section { background: #fff; border: 1px solid #dde3ed; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
      table { border-collapse: collapse; font-size: 13px; }
      th, td { border: 1px solid #cdd6e4; padding: 5px 9px; }
      th { background: #eef2f9; }
      iframe { width: 100%; height: 760px; border: 1px solid #cdd6e4; border-radius: 10px; background: #fff; }
    </style>
  </head>
  <body>
    <section>
      <h2>상위 프레임 표</h2>
      <table id="top-table">
        <thead><tr><th>구분</th><th>값</th><th>비고</th></tr></thead>
        <tbody>
          <tr><td>상위 A</td><td>1,000</td><td>top</td></tr>
          <tr><td>상위 B</td><td>2,500</td><td>top</td></tr>
        </tbody>
      </table>
    </section>
    <h2>iframe 내부 표</h2>
    <iframe src="/embed" title="embed"></iframe>
  </body>
</html>
