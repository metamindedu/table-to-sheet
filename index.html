<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>표 따오기 (Table to Sheet) — 웹페이지 표를 엑셀로</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0e13; --line: rgba(255,255,255,.14); --fg: #e9edf5; --muted: #93a3ba; --accent: #ff5a2b; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.7 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
      .wrap { max-width: 820px; margin: 0 auto; padding: 64px 22px 90px; }
      .icon { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 34px; letter-spacing: -1px; margin: 18px 0 8px; }
      h1 em { font-style: normal; color: var(--accent); }
      p.lead { color: var(--muted); font-size: 17px; margin: 0 0 26px; }
      ul { display: flex; flex-wrap: wrap; gap: 9px; list-style: none; padding: 0; margin: 0 0 30px; }
      li { font-size: 13.5px; font-weight: 700; border: 1px solid var(--line); background: rgba(255,255,255,.06); padding: 7px 13px; border-radius: 999px; }
      .links { display: flex; gap: 10px; flex-wrap: wrap; }
      a.btn { display: inline-block; padding: 11px 18px; border-radius: 10px; font-weight: 700; text-decoration: none; border: 1px solid var(--line); color: var(--fg); }
      a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .note { margin-top: 34px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="icon" src="https://raw.githubusercontent.com/metamindedu/table-to-sheet/main/extension/icons/icon-128.png" alt="표 따오기 아이콘" />
      <h1>표를 고르면 <em>엑셀로 바로</em></h1>
      <p class="lead">웹페이지의 표를 병합셀·숫자까지 살려 Excel·CSV·클립보드로. 전 기능 무료, 100% 로컬.</p>
      <ul>
        <li>자동 표 감지</li>
        <li>병합셀 유지</li>
        <li>페이지 전체 수집</li>
        <li>iframe 지원</li>
        <li>열 선택·셀 편집</li>
        <li>XLSX · CSV · JSON · MD</li>
      </ul>
      <div class="links">
        <a class="btn primary" href="privacy.html">개인정보처리방침</a>
        <a class="btn" href="https://chromewebstore.google.com/">Chrome 웹 스토어에서 설치</a>
      </div>
      <p class="note">문의: <a href="mailto:metamind@kakao.com">metamind@kakao.com</a></p>
    </div>
  </body>
</html>
